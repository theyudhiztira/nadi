name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Toolchain
        run: |
          swift --version
          sw_vers

      - name: Build
        run: swift build

      - name: Test
        run: swift test

      - name: Bundle Nadi.app
        run: scripts/bundle.sh

      - name: Verify bundle
        run: |
          codesign --verify --verbose Nadi.app
          plutil -lint Nadi.app/Contents/Info.plist

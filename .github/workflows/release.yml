name: Release

# Pushing a tag like v0.1.0 builds the ZIP and opens a draft GitHub release with it.
# The draft stays private until someone publishes it on GitHub.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build ZIP and draft release
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: bundle.sh uses the commit count as the build number.
          fetch-depth: 0
          persist-credentials: false

      - name: Check tag matches Info.plist
        env:
          TAG: ${{ github.ref_name }}
        run: |
          plist="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)"
          if [ "$TAG" != "v$plist" ]; then
            echo "::error::Tag $TAG does not match CFBundleShortVersionString $plist in Resources/Info.plist"
            exit 1
          fi

      - name: Test
        run: swift test

      - name: Bundle Nadi.app
        run: scripts/bundle.sh

      - name: Verify bundle
        run: |
          codesign --verify --strict --verbose Nadi.app
          plutil -lint Nadi.app/Contents/Info.plist

      - name: Make ZIP
        run: scripts/make-zip.sh

      - name: Draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          # 0.x versions go out as pre-releases.
          case "$version" in 0.*) pre="--prerelease" ;; *) pre="" ;; esac
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
            "dist/Nadi-$version.zip" "dist/Nadi-$version.zip.sha256" \
            --draft $pre \
            --title "Nadi $version" \
            --generate-notes
